<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello Kitty Scientific Calculator</title>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #ffe6ef;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .calculator {
            width: 100%;
            max-width: 430px;
            min-height: 100vh;
            background: #ffe6ef;
            padding: 20px 15px;
        }

        .title {
            text-align: center;
            background: white;
            border: 4px solid #ff69a4;
            padding: 18px 10px;
            margin-bottom: 10px;
            border-radius: 8px;
        }

        .title h1 {
            margin: 0;
            color: #ff1493;
            font-size: 32px;
        }

        .display {
            width: 100%;
            height: 75px;
            border: 3px solid #ff69a4;
            border-radius: 8px;
            background: white;
            color: #c21875;
            font-size: 28px;
            text-align: right;
            padding: 10px;
            margin-bottom: 15px;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            min-height: 65px;
            border: 2px solid #ff69a4;
            background: #ffb6c9;
            color: #c21875;
            font-size: 21px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }

        button:active {
            transform: scale(0.96);
            background: #ff8fb3;
        }

        .scientific {
            grid-column: span 4;
            background: #ff9fc0;
        }

        .operator {
            background: #ff9fc0;
        }

        .danger {
            background: #ff8fb3;
        }

        @media (max-width: 380px) {
            .calculator {
                padding: 12px 10px;
            }

            button {
                min-height: 58px;
                font-size: 18px;
            }

            .title h1 {
                font-size: 27px;
            }
        }
    </style>
</head>

<body>

<div class="calculator">

    <div class="title">
        <h1>🎀 Hello Kitty 🎀</h1>
    </div>

    <input type="text" id="display" class="display" value="" readonly>

    <div class="buttons">

        <button onclick="appendValue('7')">7</button>
        <button onclick="appendValue('8')">8</button>
        <button onclick="appendValue('9')">9</button>
        <button class="danger" onclick="clearDisplay()">C</button>

        <button onclick="appendValue('4')">4</button>
        <button onclick="appendValue('5')">5</button>
        <button onclick="appendValue('6')">6</button>
        <button class="operator" onclick="appendValue('/')">÷</button>

        <button onclick="appendValue('1')">1</button>
        <button onclick="appendValue('2')">2</button>
        <button onclick="appendValue('3')">3</button>
        <button class="operator" onclick="appendValue('*')">×</button>

        <button onclick="appendValue('0')">0</button>
        <button onclick="appendValue('.')">.</button>
        <button class="operator" onclick="calculate()">=</button>
        <button class="operator" onclick="appendValue('-')">−</button>

        <button onclick="appendValue('+')">+</button>
        <button onclick="appendValue('%')">%</button>
        <button onclick="squareRoot()">√</button>
        <button onclick="toggleSign()">+/−</button>

        <button onclick="square()">x²</button>
        <button onclick="cube()">x³</button>
        <button onclick="reciprocal()">1/x</button>
        <button onclick="factorial()">n!</button>

        <button onclick="sin()">sin</button>
        <button onclick="cos()">cos</button>
        <button onclick="tan()">tan</button>
        <button onclick="log()">log</button>

        <button onclick="ln()">ln</button>
        <button onclick="appendValue(Math.PI)">π</button>
        <button onclick="appendValue(Math.E)">e</button>
        <button onclick="backspace()">DEL</button>

        <button class="scientific" onclick="clearDisplay()">
            Scientific Calculator
        </button>

    </div>
</div>

<script>

    const display = document.getElementById("display");

    function appendValue(value) {
        display.value += value;
    }

    function clearDisplay() {
        display.value = "";
    }

    function backspace() {
        display.value = display.value.slice(0, -1);
    }

    function calculate() {
        try {
            display.value = eval(display.value);
        } catch {
            display.value = "Error";
        }
    }

    function getNumber() {
        return parseFloat(display.value);
    }

    function squareRoot() {
        display.value = Math.sqrt(getNumber());
    }

    function square() {
        display.value = Math.pow(getNumber(), 2);
    }

    function cube() {
        display.value = Math.pow(getNumber(), 3);
    }

    function reciprocal() {
        display.value = 1 / getNumber();
    }

    function toggleSign() {
        display.value = -getNumber();
    }

    function factorial() {
        let n = getNumber();

        if (n < 0 || !Number.isInteger(n)) {
            display.value = "Error";
            return;
        }

        let result = 1;

        for (let i = 1; i <= n; i++) {
            result *= i;
        }

        display.value = result;
    }

    function sin() {
        display.value = Math.sin(getNumber() * Math.PI / 180);
    }

    function cos() {
        display.value = Math.cos(getNumber() * Math.PI / 180);
    }

    function tan() {
        display.value = Math.tan(getNumber() * Math.PI / 180);
    }

    function log() {
        display.value = Math.log10(getNumber());
    }

    function ln() {
        display.value = Math.log(getNumber());
    }

</script>

</body>
</html>
